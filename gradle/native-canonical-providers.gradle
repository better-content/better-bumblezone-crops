// SOURCE gameTestServer only. Production repair bytes are qualified/staged by the Root provider DAG.
// No sibling build/libs, bundled historical artifact or copied repair source is an admissible substitute.
import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest
import java.util.zip.ZipFile

def binding = providers.environmentVariable('BC_CUSTOM_MOD_JAR_DIR')
if (binding.present && binding.get().trim().isEmpty()) throw new GradleException('Empty canonical provider binding')
def fixture = sourceSets.getByName('nativeFixture')
// The thin canonical Compat jar requires this version; flat-directory coordinates carry no
// transitive metadata. Do not rely on an older copy nested in an unrelated upstream provider.
dependencies.add(fixture.runtimeOnlyConfigurationName, 'io.github.llamalad7:mixinextras-forge:0.5.4')
def nativeRun = minecraft.runs.getByName('gameTestServer')
def token = new File(nativeRun.workingDirectory).name
def receipt = new File(nativeRun.workingDirectory, 'canonical-custom-providers.json')
def providersRequired = [
    [mod_id: 'better_compat_fixes', artifact: 'better-compat-fixes-0.1.9.jar', repository: 'better-compat-fixes', notation: 'bettercontent.local.crops:better-compat-fixes:0.1.9'],
    [mod_id: 'better_gameplay_notices', artifact: 'better-gameplay-notices-1.0.0.jar', repository: 'better-gameplay-notices', notation: 'bettercontent.local.crops:better-gameplay-notices:1.0.0']
]
if (binding.present) {
    repositories.flatDir {
        name = 'canonicalCropsProviders'
        dirs(binding.get())
        content { includeGroup('bettercontent.local.crops') }
    }
    providersRequired.each { row -> dependencies.add(fixture.runtimeOnlyConfigurationName, fg.deobf(row.notation)) }
}
// ForgeGradle resolves all __obfuscated dependencies together, even for ordinary compileJava.
// Do not register missing native-only coordinates during unbound pure/compile checks.
def requestedNative = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() in ['verifyFull', 'runGameTestServer', 'prepareRunGameTestServer']
}
if (requestedNative && !binding.present)
    throw new GradleException('Native Crops requires canonical BC_CUSTOM_MOD_JAR_DIR; no historical fallback')
nativeRun.property('bc.crops.providers.binding', receipt.absolutePath)
nativeRun.property('bc.crops.providers.attempt', token)
def sha = { byte[] bytes -> MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
def ordinary = { File file ->
    def path = file.toPath().toAbsolutePath().normalize()
    for (def part = path; part != null; part = part.parent)
        if (Files.isSymbolicLink(part)) throw new GradleException('Symlink canonical provider input: ' + part)
    if (!Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)) throw new GradleException('Missing canonical provider: ' + path)
    path
}
tasks.register('verifyCanonicalCustomProvidersRunConfigGuard') {
    doLast {
        minecraft.runs.each { run ->
            if (run.properties.keySet().any { it.startsWith('bc.crops.providers.') } != (run.name == 'gameTestServer'))
                throw new GradleException('Canonical provider binding escaped native launcher: ' + run.name)
        }
    }
}
tasks.matching { it.name == 'verifyFast' }.configureEach { dependsOn('verifyCanonicalCustomProvidersRunConfigGuard') }
project.ext.bcCanonicalProviderRows = {
        if (!binding.present) throw new GradleException('Native Crops requires canonical BC_CUSTOM_MOD_JAR_DIR; no historical fallback')
        providersRequired.collect { row ->
            def path = ordinary(file(binding.get()).toPath().resolve(row.artifact).toFile())
            byte[] metadata
            new ZipFile(path.toFile()).withCloseable { zip ->
                def entry = zip.getEntry('META-INF/better-content-source.properties')
                if (entry == null) throw new GradleException('Canonical provider lacks source identity: ' + path)
                metadata = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                def properties = new Properties()
                properties.load(new ByteArrayInputStream(metadata))
                if (properties.getProperty('schema') != 'bc.custom_mod_source.v1')
                    throw new GradleException('Canonical provider source schema differs: ' + path)
                def toml = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).withCloseable { it.getText('UTF-8') }
                if (!(toml =~ /modId\s*=\s*"${row.mod_id}"/).find())
                    throw new GradleException('Canonical provider mod identity differs: ' + path)
            }
            def props = new Properties()
            props.load(new ByteArrayInputStream(metadata))
            if (props.getProperty('repository') != row.repository || props.getProperty('mod_id') != row.mod_id ||
                !(props.getProperty('commit') ==~ /[a-f0-9]{40}/)) throw new GradleException('Canonical source identity/commit differs')
            [coordinate: row.notation, role: 'canonical_producer', repository: row.repository, commit: props.getProperty('commit'),
             mod_id: row.mod_id, artifact: row.artifact, path: path.toString(), sha256: sha(Files.readAllBytes(path)),
                source_metadata_sha256: sha(metadata)]
        }
}
apply from: 'gradle/native-sdk-roles.gradle'
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    classpath += fixture.runtimeClasspath
    doFirst {
        def rows = project.ext.bcCanonicalProviderRows()
        def data = [schema: 'bc.crops.canonical_providers.v1', attempt: token, providers: rows]
        byte[] bytes = JsonOutput.prettyPrint(JsonOutput.toJson(data)).getBytes('UTF-8')
        Files.write(receipt.toPath(), bytes, StandardOpenOption.CREATE_NEW)
        systemProperty('bc.crops.providers.binding.sha256', sha(bytes))
    }
    doLast {
        def proof = new groovy.json.JsonSlurper().parse(new File(nativeRun.workingDirectory, 'native-canonical-data-proof.json'))
        if (proof.canonicalProviders?.schema != 'bc.crops.canonical_providers.v1' ||
            proof.canonicalProviders?.treasureUrnStatelessRepairObserved != true ||
            proof.canonicalProviders?.originalGlobalHasBlockEntityPreserved != true ||
            proof.canonicalProviders?.actualLookupRetainsSyntheticMarker != true ||
            proof.canonicalProviders?.providers?.collect { it.mod_id } != providersRequired.collect { it.mod_id })
            throw new GradleException('Missing actual canonical-provider/treasure-urn native observation')
    }
}
